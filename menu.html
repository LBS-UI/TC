<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — Tambayan Cawag</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body data-page="menu">
  <div class="config-banner" data-config-banner hidden></div>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <span class="brand-mark">T</span>
        <span>Tambayan Cawag<small>Restaurant</small></span>
      </a>
      <nav class="nav-links" aria-label="Main">
        <a href="index.html" data-nav-link="home">Home</a>
        <a href="menu.html" data-nav-link="menu">Menu</a>
        <a href="cafe.html" data-nav-link="cafe">Cafe</a>
        <a href="about.html" data-nav-link="about">About</a>
        <a href="contact.html" data-nav-link="contact">Contact</a>
      </nav>
      <div class="nav-cta">
        <a class="btn btn-terracotta order-btn" href="order.html">Order <span class="cart-count" data-cart-count hidden>0</span></a>
        <button class="nav-toggle" type="button" data-nav-toggle aria-label="Open menu"><span></span></button>
      </div>
    </div>
    <nav class="nav-panel" data-nav-panel>
      <a href="index.html">Home</a>
      <a href="menu.html" data-nav-link="menu">Menu</a>
      <a href="cafe.html">Cafe</a>
      <a href="order.html">Order</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="container">
    <section class="menu-hero">
      <p class="kicker">Restaurant</p>
      <h1>Kitchen menu</h1>
      <p>Go-To, Snacks, and Silog. Hours: <span data-hours-label="restaurant">10:00 AM – 12:00 AM</span></p>
      <span class="status-chip" data-status="restaurant">Checking hours...</span>
    </section>
    <div data-menu-notice></div>
    <div class="filters" data-menu-filters></div>
    <p class="muted small" data-menu-count></p>
    <section class="menu-grid" data-menu-grid>
      <div class="state">Loading menu...</div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container legal">Tambayan Cawag V2 · Restaurant menu</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/menu.js"></script>
</body>
</html>
